<form method="POST">
    {% csrf_token %}
    {% for field in form %}
        <div class="mb-3 w-100 ">
            <div>
                {{ field }}
                {% if field.errors %}
                    <div class="text-danger small">
                        {{ field.errors.0 }}
                    </div>
                {% endif %}
            </div>
        </div>
    {% endfor %}
    <button type="submit" class="btn btn-primary w-100">{{ submit_action|default:"Send" }}</button>
</form>
