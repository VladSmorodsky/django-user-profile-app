{% load static %}
{% csrf_token %}
{% for field in form %}
    <div class="mb-3 w-100 ">
        <div>
            {{ field }}
            {% if field.errors %}
                <div class="text-danger small">
                    {{ field.errors.0 }}
                </div>
            {% endif %}
        </div>
    </div>
{% endfor %}
